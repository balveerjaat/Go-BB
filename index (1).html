<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Go BB</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0E0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Go BB">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0E0D;
    --panel: rgba(24,27,25,0.78);
    --panel-2: #1C201D;
    --card: #17191700;
    --line: rgba(255,255,255,0.07);
    --line-strong: rgba(255,255,255,0.13);
    --paper: #EEEAE2;
    --paper-dim: #9B9C93;
    --paper-faint: #6E7069;
    --gold: #CDA35F;
    --gold-strong: #E2B96E;
    --gold-ink: #1D1710;
    --overdue: #E07360;
    --today: #CDA35F;
    --soon: #7FA89A;
    --later: #6E7975;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 1px 1px rgba(0,0,0,.3), 0 16px 32px -12px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(900px 480px at 12% -8%, rgba(205,163,95,0.10), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(127,168,154,0.06), transparent 55%),
      var(--bg);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:var(--gold); color:var(--gold-ink); }
  h1,h2,h3{ font-family:'Fraunces', serif; margin:0; }

  .shell{
    display:grid;
    grid-template-columns:296px 1fr;
    min-height:100vh;
  }
  @media (max-width: 880px){
    .shell{ grid-template-columns:1fr; }
    .sidebar{ order:2; border-top:1px solid var(--line); border-right:none; }
    .main{ order:1; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--panel);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-right:1px solid var(--line);
    padding:32px 24px 36px;
    display:flex;
    flex-direction:column;
    gap:24px;
  }
  .brand{ margin-bottom:2px; }
  .wordmark{
    font-weight:600;
    font-size:29px;
    letter-spacing:-0.02em;
    color:var(--paper);
    display:flex;
    align-items:center;
    gap:9px;
  }
  .wordmark .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 12px 2px rgba(205,163,95,.55);
    display:inline-block;
  }
  .tagline{ color:var(--paper-faint); font-size:12.5px; margin-top:4px; letter-spacing:.01em; }

  .card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:var(--shadow);
  }
  .card-label{ font-size:12px; color:var(--paper-faint); margin:0 0 14px; letter-spacing:.02em; }

  .ring-wrap{ position:relative; width:108px; height:108px; margin:0 auto 16px; }
  .ring{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-track{ fill:none; stroke:rgba(255,255,255,.07); stroke-width:6; }
  .ring-progress{ fill:none; stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1); }
  .ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 8px;}
  .ring-value{ font-variant-numeric:tabular-nums; font-weight:700; font-size:15px; line-height:1.15; }
  .ring-caption{ font-size:10px; color:var(--paper-faint); margin-top:2px; letter-spacing:.03em; }

  .next-up-name{ font-size:18px; font-weight:600; line-height:1.3; text-align:center; margin-bottom:6px; }
  .next-up-sub{ font-size:12px; color:var(--paper-dim); text-align:center; }
  .next-up-empty{ color:var(--paper-dim); font-size:13.5px; text-align:center; padding:8px 0; }

  .btn{
    appearance:none; border:none; border-radius:11px;
    padding:12px 16px; font-family:inherit; font-size:14px; font-weight:600;
    cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:linear-gradient(180deg, var(--gold-strong), var(--gold)); color:var(--gold-ink); box-shadow:0 6px 18px -6px rgba(205,163,95,.55); }
  .btn-primary:hover{ box-shadow:0 8px 22px -6px rgba(205,163,95,.7); transform:translateY(-1px); }
  .btn-ghost{ background:transparent; color:var(--paper); border:1px solid var(--line-strong); }
  .btn-ghost:hover{ border-color:var(--gold); color:var(--gold-strong); }
  .btn-block{ width:100%; }

  .setting-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-top:1px solid var(--line); }
  .setting-row:first-of-type{ border-top:none; padding-top:2px; }
  .setting-label{ font-size:13.5px; font-weight:500; }
  .setting-hint{ font-size:11px; color:var(--paper-faint); margin-top:2px; }

  .switch{ position:relative; width:38px; height:22px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:rgba(255,255,255,.1); border-radius:999px; cursor:pointer; transition:.18s; }
  .slider::before{ content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#cfcfc9; border-radius:50%; transition:.18s; }
  input:checked + .slider{ background:rgba(205,163,95,.35); }
  input:checked + .slider::before{ transform:translateX(16px); background:var(--gold-strong); }

  .time-input{
    background:#111312; color:var(--paper); border:1px solid var(--line-strong);
    border-radius:8px; padding:7px 9px; font-family:inherit; font-size:13px;
    accent-color:var(--gold);
  }
  .time-input:focus{ outline:none; border-color:var(--gold); }

  .notif-status{ font-size:12px; color:var(--paper-dim); line-height:1.55; }
  .notif-status.on{ color:var(--soon); }

  /* ---------- Main ---------- */
  .main{ padding:40px clamp(20px,4vw,56px) 70px; max-width:900px; }
  .main-header{ margin-bottom:6px; }
  .main-header h1{ font-weight:500; font-size:30px; letter-spacing:-0.01em; }
  .main-header .date-sub{ color:var(--paper-dim); font-size:14px; margin-top:6px; }
  .header-rule{ height:1px; background:linear-gradient(90deg, var(--line-strong), transparent 70%); margin:22px 0 26px; }

  .now-banner{
    display:none;
    background:linear-gradient(90deg, rgba(224,115,96,.12), rgba(224,115,96,.02));
    border:1px solid rgba(224,115,96,.32);
    border-radius:var(--radius);
    padding:14px 18px;
    margin-bottom:24px;
    font-size:13.5px;
    color:var(--paper);
  }
  .now-banner.show{ display:block; }
  .now-banner b{ color:var(--overdue); font-weight:600; }

  .view-tabs{ display:flex; gap:6px; background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:4px; width:fit-content; margin-bottom:26px; }
  .view-tab{
    appearance:none; border:none; background:transparent; color:var(--paper-dim);
    font-family:inherit; font-size:13.5px; font-weight:600; padding:8px 20px;
    border-radius:999px; cursor:pointer; transition:.15s;
  }
  .view-tab.active{ background:linear-gradient(180deg, var(--gold-strong), var(--gold)); color:var(--gold-ink); }

  .group{ margin-bottom:32px; }
  .group-head{
    display:flex; align-items:center; gap:9px;
    font-size:13px; color:var(--paper-dim); margin-bottom:12px; letter-spacing:.01em;
  }
  .group-head .n{
    font-variant-numeric: tabular-nums; font-size:11px; color:var(--paper-faint);
    border:1px solid var(--line-strong); padding:1px 8px; border-radius:999px;
  }

  .task{
    display:flex; align-items:center; gap:14px;
    background:var(--panel-2); border:1px solid var(--line);
    border-radius:var(--radius); padding:15px 16px; margin-bottom:9px;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .task:hover{ transform:translateY(-1px); border-color:var(--line-strong); box-shadow:var(--shadow); }
  .task.is-done{ opacity:.55; }
  .task.is-done .task-name{ text-decoration:line-through; text-decoration-color:var(--paper-faint); }

  .check-btn{
    flex:none; width:24px; height:24px; border-radius:8px;
    border:1.5px solid var(--line-strong); background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
    transition:.15s; color:transparent;
  }
  .check-btn:hover{ border-color:var(--gold); }
  .check-btn.checked{ background:linear-gradient(180deg, var(--gold-strong), var(--gold)); border-color:var(--gold); color:var(--gold-ink); }

  .task-time{
    font-variant-numeric: tabular-nums; font-size:13px; color:var(--paper-faint);
    width:66px; flex:none;
  }
  .task-body{ flex:1; min-width:0; }
  .task-name{ font-size:15px; font-weight:500; }
  .task-date{ font-size:11.5px; color:var(--paper-faint); margin-top:3px; }
  .task-chip{
    font-variant-numeric: tabular-nums; font-size:11.5px; font-weight:600;
    padding:6px 11px; border-radius:999px; white-space:nowrap; flex:none;
    display:inline-flex; align-items:center; gap:6px; letter-spacing:.01em;
  }
  .task-chip .cdot{ width:5px; height:5px; border-radius:50%; flex:none; }
  .chip-overdue{ background:rgba(224,115,96,.13); color:var(--overdue); }
  .chip-overdue .cdot{ background:var(--overdue); }
  .chip-today{ background:rgba(205,163,95,.13); color:var(--gold-strong); }
  .chip-today .cdot{ background:var(--gold-strong); }
  .chip-soon{ background:rgba(127,168,154,.13); color:var(--soon); }
  .chip-soon .cdot{ background:var(--soon); }
  .chip-later{ background:rgba(255,255,255,.05); color:var(--later); }
  .chip-later .cdot{ background:var(--later); }
  .chip-done{ background:rgba(127,168,154,.13); color:var(--soon); }
  .chip-done .cdot{ background:var(--soon); }
  .chip-notdone{ background:rgba(255,255,255,.05); color:var(--later); }
  .chip-notdone .cdot{ background:var(--later); }
  .chip-pulse .cdot{ animation:pulse 1.5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.4; transform:scale(1.3);} }

  .task-del{
    flex:none; background:none; border:none; color:var(--paper-faint); cursor:pointer;
    padding:6px; border-radius:8px; opacity:.4; transition:opacity .15s, background .15s, color .15s;
    display:flex; align-items:center; justify-content:center;
  }
  .task:hover .task-del{ opacity:1; }
  .task-del:hover{ color:var(--overdue); background:rgba(224,115,96,.1); }

  .empty-state{
    color:var(--paper-dim); font-size:14px; border:1px dashed var(--line-strong);
    border-radius:var(--radius); padding:36px 20px; text-align:center;
  }
  .empty-state .es-title{ font-family:'Fraunces', serif; font-size:18px; color:var(--paper); margin-bottom:6px; font-weight:500; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(6,8,7,.68);
    backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:#17191A; border:1px solid var(--line-strong); border-radius:20px;
    width:100%; max-width:420px; padding:28px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
    animation:modalIn .22s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(10px) scale(.98);} to{ opacity:1; transform:none; } }
  .modal h2{ font-size:21px; font-weight:500; margin:0 0 20px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; color:var(--paper-dim); margin-bottom:7px; }
  .field input[type=text], .field input[type=date], .field input[type=time]{
    width:100%; background:#111312; color:var(--paper); border:1px solid var(--line-strong);
    border-radius:10px; padding:11px 13px; font-family:inherit; font-size:14.5px;
    transition:border-color .15s;
  }
  .field input:focus{ outline:none; border-color:var(--gold); }
  .quick-dates{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .qd-btn{
    background:#111312; border:1px solid var(--line-strong); color:var(--paper-dim);
    border-radius:999px; padding:7px 14px; font-size:12.5px; cursor:pointer; font-family:inherit;
    font-weight:500; transition:.15s;
  }
  .qd-btn.active{ background:var(--gold); color:var(--gold-ink); border-color:var(--gold); }
  .modal-actions{ display:flex; gap:10px; margin-top:22px; }

  .fab{ display:none; }
  @media (max-width:880px){
    .sidebar-addbtn{ display:none; }
    .fab{
      display:flex; align-items:center; justify-content:center;
      position:fixed; bottom:24px; right:24px; width:58px; height:58px;
      border-radius:50%; background:linear-gradient(180deg, var(--gold-strong), var(--gold));
      color:var(--gold-ink); border:none; cursor:pointer;
      box-shadow:0 10px 26px -6px rgba(205,163,95,.6); z-index:20;
    }
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="wordmark">Go BB<span class="dot"></span></div>
      <div class="tagline">What's next, handled.</div>
    </div>

    <div class="card">
      <p class="card-label">Next up</p>
      <div id="nextUpBody"></div>
    </div>

    <button class="btn btn-primary btn-block sidebar-addbtn" onclick="openModal()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      Add task
    </button>

    <div class="card">
      <p class="card-label">Reminders</p>
      <div class="setting-row">
        <div>
          <div class="setting-label">Morning digest</div>
          <div class="setting-hint">What's due today</div>
        </div>
        <input type="time" class="time-input" id="morningTime" value="07:00" onchange="updateSettings()">
      </div>
      <div class="setting-row">
        <div class="setting-label">30 min before</div>
        <label class="switch"><input type="checkbox" id="rem30" checked onchange="updateSettings()"><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <div class="setting-label">15 min before</div>
        <label class="switch"><input type="checkbox" id="rem15" checked onchange="updateSettings()"><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <div class="setting-label">At event time</div>
        <label class="switch"><input type="checkbox" id="remAt" checked onchange="updateSettings()"><span class="slider"></span></label>
      </div>
    </div>

    <div class="card">
      <p class="card-label">Notifications</p>
      <p class="notif-status" id="notifStatus">Turn on notifications so Go BB can alert you, even in another tab.</p>
      <button class="btn btn-ghost btn-block" style="margin-top:12px;" id="notifBtn" onclick="requestNotifPermission()">Enable notifications</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <h1 id="greeting">Good morning</h1>
      <div class="date-sub" id="dateSub"></div>
    </div>
    <div class="header-rule"></div>

    <div class="now-banner" id="nowBanner"></div>

    <div class="view-tabs">
      <button class="view-tab active" id="tabDay" onclick="setView('day')">Day</button>
      <button class="view-tab" id="tabWeek" onclick="setView('week')">Week</button>
    </div>

    <div id="groups"></div>
  </main>
</div>

<button class="fab" onclick="openModal()">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Add task</h2>
    <div class="field">
      <label for="taskName">What is it?</label>
      <input type="text" id="taskName" placeholder="e.g. Team standup" maxlength="80">
    </div>
    <div class="quick-dates" id="quickDates">
      <button class="qd-btn" data-d="0" onclick="pickQuickDate(0,this)">Today</button>
      <button class="qd-btn" data-d="1" onclick="pickQuickDate(1,this)">Tomorrow</button>
      <button class="qd-btn" data-d="3" onclick="pickQuickDate(3,this)">This week</button>
    </div>
    <div class="field">
      <label for="taskDate">Due date</label>
      <input type="date" id="taskDate">
    </div>
    <div class="field">
      <label for="taskTime">Time (optional — leave blank for an all-day task)</label>
      <input type="time" id="taskTime">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveTask()">Save task</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'gobb:data';
let state = {
  tasks: [],
  settings: { morningTime:'07:00', rem30:true, rem15:true, remAt:true },
  fired: { date:null, morning:false, at:{}, thirty:{}, fifteen:{} }
};

function todayStr(d=new Date()){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d; }

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){ /* no saved data yet, or storage unavailable */ }
  resetFiredIfNewDay();
  hydrateSettingsUI();
  render();
}

let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('Could not save', e); }
  }, 200);
}

function resetFiredIfNewDay(){
  const t = todayStr();
  if(state.fired.date !== t){
    state.fired = { date:t, morning:false, at:{}, thirty:{}, fifteen:{} };
    saveState();
  }
}

function hydrateSettingsUI(){
  document.getElementById('morningTime').value = state.settings.morningTime;
  document.getElementById('rem30').checked = state.settings.rem30;
  document.getElementById('rem15').checked = state.settings.rem15;
  document.getElementById('remAt').checked = state.settings.remAt;
}
function updateSettings(){
  state.settings = {
    morningTime: document.getElementById('morningTime').value || '07:00',
    rem30: document.getElementById('rem30').checked,
    rem15: document.getElementById('rem15').checked,
    remAt: document.getElementById('remAt').checked,
  };
  saveState();
}

/* ---------- Notifications ---------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(e=>console.error('SW register failed', e));
}
function notify(title, body){
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  if('serviceWorker' in navigator && navigator.serviceWorker.controller !== undefined){
    navigator.serviceWorker.ready.then(reg=>{
      reg.showNotification(title, { body, icon:'icon-192.png', badge:'icon-192.png' });
    }).catch(()=>{
      try{ new Notification(title, { body }); }catch(e){}
    });
  } else {
    try{ new Notification(title, { body }); }catch(e){}
  }
}
function requestNotifPermission(){
  if(!('Notification' in window)){
    document.getElementById('notifStatus').textContent = 'This browser does not support notifications.';
    return;
  }
  Notification.requestPermission().then(refreshNotifStatus);
}
function refreshNotifStatus(){
  const el = document.getElementById('notifStatus');
  const btn = document.getElementById('notifBtn');
  if(!('Notification' in window)){
    el.textContent = 'Notifications are not supported in this browser.';
    btn.style.display='none';
    return;
  }
  if(Notification.permission === 'granted'){
    el.textContent = 'Notifications are on. Keep this tab open (or the app installed) so reminders can fire.';
    el.classList.add('on');
    btn.style.display='none';
  } else if(Notification.permission === 'denied'){
    el.textContent = 'Notifications are blocked in your browser settings. You can still see everything due in the banner up top.';
  } else {
    el.textContent = 'Turn on notifications so Go BB can alert you, even in another tab.';
  }
}

/* ---------- Modal ---------- */
function openModal(){
  document.getElementById('overlay').classList.add('show');
  document.getElementById('taskName').value='';
  document.getElementById('taskDate').value = todayStr();
  document.getElementById('taskTime').value='';
  document.querySelectorAll('.qd-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.qd-btn[data-d="0"]').classList.add('active');
  setTimeout(()=>document.getElementById('taskName').focus(), 50);
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
function pickQuickDate(n, btn){
  document.querySelectorAll('.qd-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('taskDate').value = todayStr(addDays(n));
}
document.getElementById('taskDate').addEventListener('change', ()=>{
  document.querySelectorAll('.qd-btn').forEach(b=>b.classList.remove('active'));
});

function saveTask(){
  const name = document.getElementById('taskName').value.trim();
  const date = document.getElementById('taskDate').value;
  const time = document.getElementById('taskTime').value;
  if(!name || !date){ document.getElementById('taskName').focus(); return; }
  state.tasks.push({ id: 't'+Date.now()+Math.random().toString(36).slice(2,7), name, date, time: time||null, done:false });
  saveState();
  closeModal();
  render();
}
function deleteTask(id){
  state.tasks = state.tasks.filter(t=>t.id!==id);
  saveState();
  render();
}
function toggleDone(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.done = !t.done;
  saveState();
  render();
}

/* ---------- Helpers ---------- */
function dueDate(task){
  const [y,m,d] = task.date.split('-').map(Number);
  if(task.time){
    const [hh,mm] = task.time.split(':').map(Number);
    return new Date(y, m-1, d, hh, mm, 0);
  }
  return new Date(y, m-1, d, 23, 59, 0);
}
function fmtTime(t){
  if(!t) return 'All day';
  const [hh,mm] = t.split(':').map(Number);
  const ap = hh>=12?'PM':'AM';
  const h12 = ((hh+11)%12)+1;
  return h12+':'+String(mm).padStart(2,'0')+' '+ap;
}
function fmtDateShort(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  return dt.toLocaleDateString(undefined,{ weekday:'short', month:'short', day:'numeric' });
}
function hoursLeftLabel(ms){
  const overdue = ms < 0;
  const abs = Math.abs(ms);
  const mins = Math.round(abs/60000);
  const hrs = Math.floor(mins/60);
  const days = Math.floor(hrs/24);
  let label;
  if(days >= 1){ label = days+'d '+(hrs%24)+'h'; }
  else if(hrs >= 1){ label = hrs+'h '+(mins%60)+'m'; }
  else { label = mins+'m'; }
  return { text: overdue? label+' overdue' : label+' left', overdue, mins };
}
function categorize(task){
  const now = new Date();
  const due = dueDate(task);
  const t0 = todayStr();
  const t1 = todayStr(addDays(1));
  if(due < now && task.date <= t0) return 'overdue';
  if(task.date === t0) return 'today';
  if(task.date === t1) return 'tomorrow';
  const weekOut = todayStr(addDays(7));
  if(task.date <= weekOut) return 'week';
  return 'later';
}
function getGreeting(){
  const h = new Date().getHours();
  if(h < 5) return 'Still up?';
  if(h < 12) return 'Good morning';
  if(h < 17) return 'Good afternoon';
  if(h < 21) return 'Good evening';
  return 'Winding down';
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Rendering ---------- */
let activeView = 'day';
function setView(v){
  activeView = v;
  document.getElementById('tabDay').classList.toggle('active', v==='day');
  document.getElementById('tabWeek').classList.toggle('active', v==='week');
  render();
}

function taskRowHtml(t, now){
  const due = dueDate(t);
  const diff = due - now;
  let chipHtml, rowDoneClass = '';
  if(t.done){
    chipHtml = `<div class="task-chip chip-done"><span class="cdot"></span>Done</div>`;
    rowDoneClass = ' is-done';
  } else {
    const key = categorize(t);
    const info = hoursLeftLabel(diff);
    const chipClass = key==='overdue' ? 'chip-overdue' : key==='today' ? 'chip-today' : key==='tomorrow' ? 'chip-soon' : 'chip-later';
    const pulse = (key!=='later' && Math.abs(diff) < 30*60000) ? ' chip-pulse' : '';
    chipHtml = `<div class="task-chip ${chipClass}${pulse}"><span class="cdot"></span>${info.text}</div>`;
  }
  const checkIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `
    <div class="task${rowDoneClass}">
      <button class="check-btn${t.done?' checked':''}" title="${t.done?'Mark undone':'Mark done'}" onclick="toggleDone('${t.id}')">${t.done?checkIcon:''}</button>
      <div class="task-time">${fmtTime(t.time)}</div>
      <div class="task-body">
        <div class="task-name">${escapeHtml(t.name)}</div>
        <div class="task-date">${fmtDateShort(t.date)}</div>
      </div>
      ${chipHtml}
      <button class="task-del" title="Delete" onclick="deleteTask('${t.id}')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4.8c0-.44.36-.8.8-.8h4.4c.44 0 .8.36.8.8V7m2 0-.8 13.2c-.03.44-.4.8-.8.8H7.6c-.4 0-.77-.36-.8-.8L6 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  `;
}

function renderSectionList(containerId, list, now, emptyText){
  const wrap = document.getElementById(containerId);
  if(list.length===0){
    wrap.innerHTML = emptyText ? `<div class="empty-state">${emptyText}</div>` : '';
    return;
  }
  wrap.innerHTML = list.map(t=>taskRowHtml(t, now)).join('');
}

function render(){
  const now = new Date();
  document.getElementById('greeting').textContent = getGreeting();
  document.getElementById('dateSub').textContent = now.toLocaleDateString(undefined,{ weekday:'long', month:'long', day:'numeric' });

  const t0 = todayStr();
  const weekEnd = todayStr(addDays(7));
  const pool = activeView==='day'
    ? state.tasks.filter(t=> t.date===t0)
    : state.tasks.filter(t=> t.date>=t0 && t.date<=weekEnd);

  const notDone = pool.filter(t=>!t.done).sort((a,b)=> dueDate(a)-dueDate(b));
  const done = pool.filter(t=>t.done).sort((a,b)=> dueDate(a)-dueDate(b));

  const wrap = document.getElementById('groups');
  const emptyMsg = activeView==='day'
    ? `<div class="es-title">A clear day</div>Nothing due today. Add your first task to get started.`
    : `<div class="es-title">A clear week</div>Nothing on the calendar for the next 7 days.`;

  if(pool.length===0){
    wrap.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
  } else {
    let html = '';
    html += `<div class="group"><div class="group-head">To do <span class="n">${notDone.length}</span></div><div id="listTodo"></div></div>`;
    if(done.length>0){
      html += `<div class="group"><div class="group-head">Completed <span class="n">${done.length}</span></div><div id="listDone"></div></div>`;
    }
    wrap.innerHTML = html;
    renderSectionList('listTodo', notDone, now, notDone.length===0 ? "Nothing left to do &mdash; nice work." : null);
    if(done.length>0) renderSectionList('listDone', done, now, null);
  }

  renderNextUp(now);
  renderNowBanner(now);
}

function renderNextUp(now){
  const candidates = state.tasks
    .filter(t=>!t.done && t.date>=todayStr())
    .sort((a,b)=> dueDate(a)-dueDate(b));
  const el = document.getElementById('nextUpBody');
  if(candidates.length===0){
    el.innerHTML = `<p class="next-up-empty">Nothing on the horizon.<br>Add something below.</p>`;
    return;
  }
  const t = candidates[0];
  const due = dueDate(t);
  const diff = due - now;
  const info = hoursLeftLabel(diff);
  const r = 44;
  const circ = 2*Math.PI*r;
  const remainingHours = diff/3600000;
  const fraction = info.overdue ? 1 : Math.min(1, Math.max(0, 1 - remainingHours/24));
  const offset = circ * (1-fraction);
  const color = info.overdue ? 'var(--overdue)' : (remainingHours <= 3 ? 'var(--gold-strong)' : 'var(--soon)');
  el.innerHTML = `
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 100 100">
        <circle class="ring-track" cx="50" cy="50" r="${r}"/>
        <circle class="ring-progress" cx="50" cy="50" r="${r}"
          style="stroke-dasharray:${circ.toFixed(1)}; stroke-dashoffset:${offset.toFixed(1)}; stroke:${color};"/>
      </svg>
      <div class="ring-center">
        <div class="ring-value">${info.text.replace(' overdue','').replace(' left','')}</div>
        <div class="ring-caption">${info.overdue ? 'overdue' : 'left'}</div>
      </div>
    </div>
    <p class="next-up-name">${escapeHtml(t.name)}</p>
    <p class="next-up-sub">${fmtDateShort(t.date)} &middot; ${fmtTime(t.time)}</p>
  `;
}

function renderNowBanner(now){
  const soon = state.tasks.filter(t=>{
    if(t.done || t.date!==todayStr()) return false;
    const diff = dueDate(t) - now;
    return diff < 30*60000;
  });
  const banner = document.getElementById('nowBanner');
  if(soon.length===0){ banner.classList.remove('show'); return; }
  const names = soon.slice(0,3).map(t=>t.name).join(', ');
  banner.innerHTML = `<b>Happening now or very soon:</b> ${escapeHtml(names)}${soon.length>3? ' and '+(soon.length-3)+' more':''}`;
  banner.classList.add('show');
}

/* ---------- Reminder engine ---------- */
function checkReminders(){
  resetFiredIfNewDay();
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const nowHM = hh+':'+mm;

  if(!state.fired.morning && nowHM === state.settings.morningTime){
    const t0 = todayStr();
    const dueToday = state.tasks.filter(t=>t.date===t0 && !t.done);
    if(dueToday.length){
      const names = dueToday.slice(0,4).map(t=> (t.time? fmtTime(t.time)+' '+t.name : t.name)).join(' \u2022 ');
      notify('Go BB \u2014 today', names + (dueToday.length>4? ` and ${dueToday.length-4} more`:''));
    } else {
      notify('Go BB \u2014 today', "Nothing due today. Clear runway.");
    }
    state.fired.morning = true;
    saveState();
  }

  state.tasks.forEach(t=>{
    if(!t.time || t.done) return;
    const due = dueDate(t);
    const diffMin = (due - now)/60000;

    if(state.settings.remAt && !state.fired.at[t.id] && diffMin <= 0 && diffMin > -1){
      notify('Go BB', `${t.name} is starting now.`);
      state.fired.at[t.id] = true; saveState();
    }
    if(state.settings.rem30 && !state.fired.thirty[t.id] && diffMin <= 30 && diffMin > 29){
      notify('Go BB', `${t.name} in 30 minutes.`);
      state.fired.thirty[t.id] = true; saveState();
    }
    if(state.settings.rem15 && !state.fired.fifteen[t.id] && diffMin <= 15 && diffMin > 14){
      notify('Go BB', `${t.name} in 15 minutes.`);
      state.fired.fifteen[t.id] = true; saveState();
    }
  });
}

/* ---------- Init ---------- */
refreshNotifStatus();
loadState();
setInterval(render, 30000);
setInterval(checkReminders, 20000);
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
</script>
